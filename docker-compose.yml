version: '3.9'

services:

  api:
    build: ./api
    ports:
      - "8000:8000"

  db:
    image: postgres:15

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  etl:
    build: ./etl

    depends_on:
      - api
      - db

    env_file:
      - .env

volumes:
  postgres_data: